<body>

      <a href="resume.html">Resume</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
        <svg class="toggle-icon icon-moon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="toggle-icon icon-sun" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>

      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
    <a href="resume.html">Resume</a>
  </div>

  <main class="page">
    <div class="section-eyebrow">Get in touch</div>
    <div class="gold-rule"></div>
    <h2 class="section-title">Contact</h2>
    <div class="contact-grid">
      <div>
        <p class="contact-info-text">
          Have a project in mind or just want to say hello?
          I'm always open to new conversations and collaborations.
        </p>
        <div class="contact-detail">
          <div class="contact-detail-icon">@</div>
          <span>jmsaj.061401@gmail.com</span>
        </div>
        <div class="contact-detail">
          <div class="contact-detail-icon">&#9679;</div>
          <span>Inopacan, Leyte, Philippines</span>
        </div>
        <div class="contact-detail">
          <div class="contact-detail-icon">&#9670;</div>
          <span>Available for freelance</span>
        </div>
      </div>
      <form onsubmit="handleSubmit(event)">
        <div class="form-row">
          <input type="text"  placeholder="Your name"  required>
          <input type="email" placeholder="Your email" required>
        </div>
        <div class="form-group">
          <input type="text" placeholder="Subject" style="width:100%">
        </div>
        <div class="form-group">
          <textarea placeholder="Your message"></textarea>
        </div>
        <button type="submit" class="btn-gold" style="width:100%;">Send Message</button>
      </form>
    </div>
  </main>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
